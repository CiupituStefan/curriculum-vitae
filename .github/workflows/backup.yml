# Weekly encrypted database backup with an automatic restore test (ISO/IEC 27001 A.12.3.1).
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Project Settings → Database → Connection string (session pooler, URI)
#   BACKUP_PASSPHRASE   long random passphrase, stored ALSO outside GitHub (password manager)
# The repository is public, so the dump is encrypted (AES-256, GPG symmetric) before upload.
# Without the secrets the job ends with a notice and does nothing.
name: Backup

on:
  schedule:
    - cron: "41 2 * * 0" # Sundays 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backup not configured (SUPABASE_DB_URL / BACKUP_PASSPHRASE missing). Skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PostgreSQL 17 client
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump (public schema: content, projects, messages, logs)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          umask 077
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --format=custom --no-owner --no-privileges --file=backup.dump
          test -s backup.dump
      - name: Restore test into a throw-away database
        if: steps.cfg.outputs.enabled == 'true'
        env:
          PGPASSWORD: restore-test
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_restore --list backup.dump > /dev/null
          psql -h localhost -U postgres -c "create role anon; create role authenticated; create role service_role; create schema auth; create table auth.users(id uuid primary key); create function auth.uid() returns uuid language sql as 'select null::uuid'; create function auth.jwt() returns jsonb language sql as 'select ''{}''::jsonb'; create table auth.mfa_factors(id uuid, user_id uuid, status text);" > /dev/null
          /usr/lib/postgresql/17/bin/pg_restore -h localhost -U postgres -d postgres --no-owner --no-privileges backup.dump || true
          psql -h localhost -U postgres -tAc "select 'cv_sections=' || count(*) from public.cv_sections" | tee restore-check.txt
          grep -Eq "cv_sections=1[0-9]" restore-check.txt
      - name: Encrypt
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          umask 077
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "backup-$(date -u +%F).dump.gpg" backup.dump <<< "$BACKUP_PASSPHRASE"
          shred -u backup.dump
      - name: Upload encrypted backup (30 days)
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup-encrypted
          path: backup-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
