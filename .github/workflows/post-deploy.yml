# Post-deployment verification. Vercel (native Git integration) is the single deployment
# mechanism; when it reports a successful deployment to GitHub, this workflow runs read-only
# smoke tests against the deployed URL, and an OWASP ZAP baseline scan for production.
# The workflow definition always comes from the default branch, so PR code never runs here.
name: Post-deploy checks

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    name: Smoke tests on ${{ github.event.deployment_status.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Health check
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" "$E2E_BASE_URL/api/health") && [ "$code" = "200" ] && exit 0
            echo "attempt $attempt: HTTP $code"; sleep $((attempt * 5))
          done
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (@smoke)
        run: npx playwright test --grep @smoke --project desktop

  zap:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    name: OWASP ZAP baseline (production)
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # the action can open an issue with the report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
